# Optional: opens a pull request in your team's copy when the upstream slides repo changes.
# Shipped disabled (manual runs only). To use it in your private copy:
#   1. set source_repo_path below to the upstream repo (owner/name),
#   2. uncomment the schedule,
#   3. allow Actions to create pull requests (Settings → Actions → General),
#   4. pin the action below to a commit SHA you have reviewed (it is third-party code with write access).
# Locally, `npm run upgrade` does the same merge and runs check and verify.
name: upstream-sync
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: false # remove this line when you've configured the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: ANT1OFF/slides
          upstream_branch: main
          pr_title: "Upgrade from upstream"
